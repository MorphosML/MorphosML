[build-system]
requires = ["setuptools>=61.0", "wheel", "pybind11>=2.10.0"]
build-backend = "setuptools.build_meta"

[project]
name = "morphosml"
version = "0.4.0"
description = "High-performance machine learning library with C++ core"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [
    {name = "Gabriel Carmona", email = "gabriel@carmona.ai"}
]
dependencies = [
    "numpy>=1.24.0"
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py312"]
include = '\.pyi?$'

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E731"]
