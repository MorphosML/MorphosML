[build-system]
requires = [
    "scikit-build-core>=0.5.0",
    "pybind11>=2.10.0",
    "numpy>=1.24.0",
]
build-backend = "scikit_build_core.build"

[project]
name = "morphosml"
version = "0.2.0"
description = "High-performance machine learning library with C++ core"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Gabriel Carmona", email = "gabriel@carmona.ai"}
]
keywords = ["machine-learning", "knn", "cpp", "pybind11", "fast"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "pytest-cov>=4.0.0"]

[project.urls]
Homepage = "https://github.com/gabrielcarmona/morphosml"
Repository = "https://github.com/gabrielcarmona/morphosml.git"

[tool.scikit-build]
cmake.minimum-version = "3.15"
cmake.args = ["-DCMAKE_CXX_STANDARD=17"]
wheel.py-api = "pybind11"