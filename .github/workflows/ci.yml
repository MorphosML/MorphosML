name: CI - Build and Test

on:
  push:
    branches: [main, develop, "0.*", "*_version"]
  pull_request:
    branches: [main, develop, "0.*", "*_version"]
  workflow_dispatch:

jobs:
  # Job 1: Test with Docker (Linux only)
  docker-test:
    name: Docker Test (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t morphosml:test .

      - name: Run tests in Docker
        run: |
          docker run --rm -v ${{ github.workspace }}/tests:/app/tests morphosml:test pytest tests/ -v

      - name: Test import in Docker
        run: |
          docker run --rm morphosml:test python3 -c "from morphosml import KNN, Vector, Matrix; print('All imports work')"

  # Job 2: Native build and test (multi-platform matrix)
  native-test:
    name: ${{ matrix.os }} - Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: |
          brew install cmake

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install pybind11 numpy pytest pytest-cov

      - name: Build and install
        run: |
          pip install -e . -v

      - name: Run tests
        run: |
          pytest tests/ -v --cov=morphosml --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: ${{ matrix.os }}-py${{ matrix.python-version }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # Job 3: Linting and Code Quality
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install linting tools
        run: |
          pip install black ruff mypy

      - name: Check formatting
        run: black --check --target-version py312 src/ tests/

      - name: Lint with ruff
        run: ruff check src/ tests/

      - name: Type check
        run: mypy src/ --ignore-missing-imports

  # Job 4: Security scan
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install security tools
        run: |
          pip install bandit pip-audit

      - name: Run bandit
        run: bandit -r src/ -ll

      - name: Check dependencies
        run: pip-audit --desc on

  # Job 5: Build wheels (release & pre-release)
  build-wheels:
    name: Build wheels for release
    runs-on: ubuntu-latest
    needs: [native-test, lint, security]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/0.') || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake
          pip install build wheel setuptools pybind11 twine

      - name: Build wheels
        run: python -m build

      - name: Check wheels
        run: twine check dist/*

      - name: Upload wheels as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: morphosml-wheels
          path: dist/
          retention-days: 7